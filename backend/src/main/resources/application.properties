server.port=8080

# Default: file-based H2 in MySQL compatibility mode. Data survives restarts (./data/clinic.mv.db).
spring.datasource.url=jdbc:h2:file:./data/clinic;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Runs schema.sql on every startup (it only uses CREATE TABLE IF NOT EXISTS).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Allowed frontend origin (Vite dev server)
clinic.cors.allowed-origin=http://localhost:5173

# Mock OTP login. demo-otp=true also returns the code in the API response so the UI can show it.
# Set to false to only print it in the server log.
clinic.auth.admin-email=admin@clinic.test
clinic.auth.demo-otp=true

# Keep read-only CSV copies of each table in this folder, refreshed after every change.
clinic.csv.enabled=true
clinic.csv.dir=./data

# H2 web console at /h2-console (local access only). JDBC URL: jdbc:h2:file:./data/clinic;MODE=MySQL;DATABASE_TO_LOWER=TRUE  user: sa  password: (empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# H2 TCP server (local only) so VS Code database extensions can connect while the app runs.
# Client URL: jdbc:h2:tcp://localhost:9092/<absolute path to backend/data/clinic>;MODE=MySQL;DATABASE_TO_LOWER=TRUE
clinic.h2.tcp.enabled=true
clinic.h2.tcp.port=9092
